name: payflow

services:
  db:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  db_test:
    image: postgres:18

  psp_db:
    image: postgres:18

    environment:
      POSTGRES_DB: payflow_psp
      POSTGRES_USER: payflow_psp
      POSTGRES_PASSWORD: ${PSP_POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - psp_postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  psp_db_test:
    image: postgres:18

    environment:
      POSTGRES_DB: payflow_psp_test
      POSTGRES_USER: payflow_psp_test
      POSTGRES_PASSWORD: payflow_psp_test_password

    ports:
      - "127.0.0.1:5436:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payflow_psp_test -d payflow_psp_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data:
  psp_postgres_data: